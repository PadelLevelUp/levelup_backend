name: Build and Deploy Backend to Staging

# Staging lives on the same VM as production, in its own container
# (padelapp_staging on host port 5100) against its own database
# (padel_app_staging in the shared postgres container).
on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-gce-backend-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Install Poetry
      run: pipx install poetry

    - name: Check lockfile is up-to-date
      run: poetry check --lock

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
        platforms: linux/amd64

    - name: Copy .env.staging to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: ".env.staging"
        target: "/home/${{ secrets.GCE_USER }}/"
        overwrite: true

    - name: Deploy on GCE
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        script: |
          docker network create levelup_net || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
          docker stop padelapp_staging || true && docker rm padelapp_staging || true
          # --memory caps staging so it can never starve production of RAM on
          # the shared VM. No VAPID / OPENROUTER / GCS / MAIL_PASSWORD is passed
          # on purpose: staging must not push, spend credit, write to the prod
          # uploads bucket, or email real users.
          docker run -d --name padelapp_staging \
            --restart unless-stopped \
            --network levelup_net \
            --memory 400m \
            -p 5100:80 \
            --env-file /home/${{ secrets.GCE_USER }}/.env.staging \
            -e POSTGRES_PW=${{ secrets.POSTGRES_PW }} \
            -e FLASK_SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/levelup_backend:staging
          docker image prune -f || true
